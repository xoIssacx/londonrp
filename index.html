<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoreside State Roleplay | Server Rules</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0d0d0d;
            color: #f2f2f2;
            overflow-x: hidden;
            animation: fadeIn 1.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideDown {
            from { transform: translateY(-40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        header {
            background: #1a1a1a;
            padding: 25px;
            text-align: center;
            border-bottom: 3px solid #0077ff;
            animation: slideDown 1s ease-out;
        }

        header img {
            max-width: 180px;
            height: auto;
            margin-bottom: 10px;
            animation: fadeIn 1.5s ease-in-out;
        }

        header h1 {
            margin: 0;
            font-size: 2.7rem;
            letter-spacing: 2px;
            color: #0077ff;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #1a1a1a;
            border-radius: 8px;
            border: 1px solid #333;
            animation: slideUp 1.2s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        h2 {
            color: #0077ff;
            border-bottom: 2px solid #0077ff;
            padding-bottom: 5px;
        }

        ul {
            line-height: 1.8;
            font-size: 1.1rem;
            list-style: none;
            padding: 0;
        }

        ul li {
            background: #111;
            padding: 12px 15px;
            margin: 10px 0;
            border-left: 4px solid #0077ff;
            border-radius: 4px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            animation: fadeInItem 0.6s ease forwards;
            opacity: 0;
        }

        ul li:nth-child(1) { animation-delay: 0.2s; }
        ul li:nth-child(2) { animation-delay: 0.35s; }
        ul li:nth-child(3) { animation-delay: 0.5s; }
        ul li:nth-child(4) { animation-delay: 0.65s; }
        ul li:nth-child(5) { animation-delay: 0.8s; }
        ul li:nth-child(6) { animation-delay: 0.95s; }
        ul li:nth-child(7) { animation-delay: 1.1s; }
        ul li:nth-child(8) { animation-delay: 1.25s; }
        ul li:nth-child(9) { animation-delay: 1.4s; }
        ul li:nth-child(10) { animation-delay: 1.55s; }
    </style>
</head>

<body>
    <header>
        <img src="content.png" alt="Server Logo">
        <h1>Shoreside State Roleplay</h1>
    </header>

    <div class="container">
        <h2>Server Rules</h2>
        <ul>
            <li>No Fail RP</li>
            <li>No RDM</li>
            <li>No VDM</li>
            <li>No Cop Baiting</li>
            <li>No Breaking Character</li>
            <li>No Unrealistic Driving</li>
            <li>No Exploiting or Glitch Abuse</li>
            <li>No Toxicity or Harassment</li>
            <li>Follow Staff Instructions at All Times</li>
            <li>Use Common Sense</li>
        </ul>
    </div>
</body>
</html>
